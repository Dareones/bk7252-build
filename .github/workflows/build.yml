          test -s "$PATCH_FILE"
          ACTUAL_SHA="$(sha256sum "$PATCH_FILE" | awk '{print $1}')"
          EXPECTED_SHA="ce60c439d4070fb23561c439341c2deefc2d18552504987c1adfb2c36f159732"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Embedded patch checksum mismatch" >&2
            exit 1
          fi
          echo "Embedded patch restored: $(wc -c < "$PATCH_FILE") bytes; SHA256=$ACTUAL_SHA"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 patch xz-utils make git wget \
            libc6-i386 lib32z1 lib32stdc++6 binutils file

      - name: Clone pinned OpenBeken and its pinned submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/openshwprojects/OpenBK7231T_App.git obk
          git -C obk checkout "$OBK_COMMIT"
          git -C obk submodule update --init --recursive --depth 1 \
            sdk/beken_freertos_sdk libraries/berry

          OBK_SHA="$(git -C obk rev-parse HEAD)"
          SDK_SHA="$(git -C obk/sdk/beken_freertos_sdk rev-parse HEAD)"
          BERRY_SHA="$(git -C obk/libraries/berry rev-parse HEAD)"
          echo "OpenBK7231T_App=$OBK_SHA" | tee -a "$GITHUB_WORKSPACE/result/build-info.txt"
          echo "beken_freertos_sdk=$SDK_SHA" | tee -a "$GITHUB_WORKSPACE/result/build-info.txt"
          echo "berry=$BERRY_SHA" | tee -a "$GITHUB_WORKSPACE/result/build-info.txt"

          [[ "${OBK_SHA:0:8}" == "$OBK_COMMIT" ]]
          [[ "${SDK_SHA:0:${#EXPECTED_SDK_PREFIX}}" == "$EXPECTED_SDK_PREFIX" ]] || {
            echo "Unexpected SDK revision. Expected prefix $EXPECTED_SDK_PREFIX, got $SDK_SHA" >&2
            exit 1
          }

      - name: Check and apply embedded BK7252U GC0329 patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE="$RUNNER_TEMP/bk7252_gc0329_cam5.patch"
          test -s "$PATCH_FILE" || {
            echo "Embedded camera patch was not restored" >&2
            exit 1
          }

          cd "$GITHUB_WORKSPACE/obk"
          patch --dry-run --batch --forward --fuzz=0 -p1 \
            < "$PATCH_FILE" 2>&1 | tee "$GITHUB_WORKSPACE/patch-check.log"
          patch --batch --forward --fuzz=0 -p1 \
            < "$PATCH_FILE" 2>&1 | tee "$GITHUB_WORKSPACE/patch.log"

          if find . -type f \( -name '*.rej' -o -name '*.orig' \) -print -quit | grep -q .; then
            echo "Patch left .rej/.orig files; refusing to build" >&2
            exit 1
          fi

          # Guard against accidentally building a non-camera or wrong-sensor tree.
          grep -q 'ENABLE_DRIVER_CAMERA_BK7252=1' platforms/BK723x/OpenBeken.mk
          grep -q 'gc0329v_init_talbe' sdk/beken_freertos_sdk/beken378/func/camera_intf/camera_intf.h
          grep -q '0x31' src/driver/drv_camera_bk7252.c
          grep -q 'ifeq ($(CFG_USE_CAMERA_INTF), 1)' sdk/beken_freertos_sdk/beken378/beken_src.mk
          echo "Patch checks passed: BK7251/SOC_BK7221U + GC0329 7-bit SCCB 0x31"

      - name: Build UART firmware and QIO image
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/obk"
          make APP_VERSION="$VERSION" APP_NAME=OpenBK7252 VARIANT=default OpenBK7252 \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify UART binary and audit camera linkage
        shell: bash
        run: |
          set -euo pipefail
          UA="$(find "$GITHUB_WORKSPACE/obk/output" -type f \
            -name "OpenBK7252_UA_${VERSION}.bin" -print -quit 2>/dev/null || true)"
          if [[ -z "$UA" || ! -s "$UA" ]]; then
            echo "Build returned without the required OpenBK7252_UA_${VERSION}.bin" >&2
            find "$GITHUB_WORKSPACE/obk" -maxdepth 6 -type f \
              \( -name '*.bin' -o -name '*.elf' -o -name '*.map' \) -printf '%p %s bytes\n' | head -100
            exit 1
          fi

          file "$UA"
          stat -c 'UART binary size: %s bytes' "$UA"
          mkdir -p "$GITHUB_WORKSPACE/result/firmware" "$GITHUB_WORKSPACE/result/link-audit"
          cp "$UA" "$GITHUB_WORKSPACE/result/firmware/"

          # A raw `strings` check is not a reliable link test for every packaged
          # Beken image. Keep it as evidence, but audit the ELF/MAP symbols too.
          LINK_STATUS="UNCONFIRMED"
          MARKER="$(strings "$UA" | grep -F 'Camera: BK7252 driver registered' || true)"
          if [[ -n "$MARKER" ]]; then
            echo "UART image contains the camera registration log string."
            LINK_STATUS="VERIFIED_BY_UART_STRING"
          else
            echo "NOTE: registration string not visible in UA image; checking linker outputs."
          fi

          while IFS= read -r -d '' F; do
            REL="${F#"$GITHUB_WORKSPACE/obk/"}"
            mkdir -p "$GITHUB_WORKSPACE/result/link-audit/$(dirname "$REL")"
            cp "$F" "$GITHUB_WORKSPACE/result/link-audit/$REL"
            if [[ "$F" == *.elf || "$F" == *.axf ]]; then
              if nm -a "$F" 2>/dev/null | grep -Eq '[[:space:]]Camera_BK7252_Init$'; then
                echo "Camera_BK7252_Init found in ELF: $REL"
                LINK_STATUS="VERIFIED_BY_ELF_SYMBOL"
              fi
            elif [[ "$F" == *.map ]]; then
              if grep -Eq 'Camera_BK7252_Init|drv_camera_bk7252' "$F"; then
                echo "Camera driver reference found in MAP: $REL"
                [[ "$LINK_STATUS" == VERIFIED_BY_ELF_SYMBOL ]] || LINK_STATUS="VERIFIED_BY_MAP"
              fi
            fi
          done < <(find "$GITHUB_WORKSPACE/obk" -type f \
            \( -name '*.elf' -o -name '*.axf' -o -name '*.map' \) -size +0c -print0)

          if [[ -f "$GITHUB_WORKSPACE/build.log" ]] && grep -Fq 'drv_camera_bk7252.c' "$GITHUB_WORKSPACE/build.log"; then
            echo "Build log mentions compilation of drv_camera_bk7252.c." \
              | tee "$GITHUB_WORKSPACE/result/link-audit/build-log-driver-reference.txt"
          fi

          {
            echo "UART_IMAGE=$(basename "$UA")"
            echo "UART_SIZE=$(stat -c '%s' "$UA")"
            echo "CAMERA_LINK_STATUS=$LINK_STATUS"
            echo "UART_MARKER_PRESENT=$([[ -n "$MARKER" ]] && echo yes || echo no)"
          } | tee "$GITHUB_WORKSPACE/result/camera-link-audit.txt"

          if [[ "$LINK_STATUS" == UNCONFIRMED ]]; then
            echo "WARNING: UART image was produced, but camera driver linkage is not yet proven." \
              | tee -a "$GITHUB_WORKSPACE/result/camera-link-audit.txt"
          fi

          QIO="$(find "$GITHUB_WORKSPACE/obk/output" -type f \
            -name "OpenBK7252_QIO_${VERSION}.bin" -print -quit 2>/dev/null || true)"
          if [[ -n "$QIO" && -s "$QIO" ]]; then
            cp "$QIO" "$GITHUB_WORKSPACE/result/firmware/"
          fi

          (cd "$GITHUB_WORKSPACE/result/firmware" && sha256sum *.bin > SHA256SUMS.txt && md5sum *.bin > MD5SUMS.txt)
          echo "UART image copied to artifact: $(basename "$UA")" \
            | tee -a "$GITHUB_WORKSPACE/result/build-info.txt"

      - name: Collect build logs and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/result/logs"
          for f in patch-check.log patch.log build.log; do
            [[ ! -f "$GITHUB_WORKSPACE/$f" ]] || cp "$GITHUB_WORKSPACE/$f" "$GITHUB_WORKSPACE/result/logs/"
          done
          if [[ -d "$GITHUB_WORKSPACE/obk/sdk/beken_freertos_sdk/out" ]]; then
            find "$GITHUB_WORKSPACE/obk/sdk/beken_freertos_sdk/out" -maxdepth 1 \
              -type f \( -name '*.elf' -o -name '*.map' \) -exec cp {} "$GITHUB_WORKSPACE/result/" \; 2>/dev/null || true
          fi
          find "$GITHUB_WORKSPACE/result" -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Upload firmware, symbols and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BK7252U-GC0329-${{ inputs.version }}
          path: result/
          if-no-files-found: error
          retention-days: 14
