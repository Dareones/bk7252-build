name: BK7252U camera build

on:
  workflow_dispatch:
    inputs:
      target:
        default: 'bk7251'
      version:
        default: '0.4.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 patch xz-utils make git libc6-i386 lib32z1 lib32stdc++6

      - name: Clone pinned sources
        run: |
          git clone -q https://github.com/openshwprojects/OpenBK7231T_App.git obk
          cd obk && git checkout -q 168cba55
          git submodule update --init --depth 1 sdk/beken_freertos_sdk libraries/berry
          git clone -q https://github.com/pingwiner/bk7252n-camera.git ../cam

      - name: Apply camera patch
        run: |
          cd obk
          patch -p1 --forward --no-backup-if-mismatch < ../cam/openbk-port/bk7252n-camera-openbk.patch > ../patch.log 2>&1 || true
          tail -3 ../patch.log
          find . -name '*.rej' | head

      - name: Configure for BK7252U
        run: |
          cd obk
          python3 - <<'PY'
          import re, os
          cfg='src/obk_config.h'

          # 1) включаем драйвер камеры ТОЛЬКО в том блоке, где ENABLE_DRIVER_BKCAM
          L=open(cfg).read().split('\n'); done=[]
          for i,l in enumerate(L):
              if l.strip()=='#if PLATFORM_BK7252N' and 'ENABLE_DRIVER_BKCAM' in '\n'.join(L[i:i+12]):
                  L[i]='#if PLATFORM_BK7252N || PLATFORM_BK7252'; done.append(i+1)
          open(cfg,'w').write('\n'.join(L))
          print('BKCAM guard patched at:', done)

          def force_off(macro):
              s=open(cfg).read(); i=s.rfind('#endif')
              s=s[:i]+'\n#undef %s\n#define %s 0\n'%(macro,macro)+s[i:]
              open(cfg,'w').write(s); print('FORCED OFF:', macro)

          # 2) гасим периферию, которой у BK7252U физически нет
          for p in ['src/driver/drv_bkCharge.c']:
              if not os.path.exists(p): print('missing', p); continue
              for l in open(p).read().split('\n'):
                  t=l.strip()
                  if t.startswith('#if'):
                      print(p, '-> guard:', t)
                      m=re.fullmatch(r'#if\s+(ENABLE_[A-Z0-9_]+)', t)
                      if m: force_off(m.group(1))
                      else: print('!! complex guard, needs manual fix:', t)
                      break
          PY
          # 3) сломанный ifeq в SDK
          sed -i 's/ifeq ($CFG_USE_CAMERA_INTF), 1)/ifeq ($(CFG_USE_CAMERA_INTF),1)/' sdk/beken_freertos_sdk/beken378/beken_src.mk
          echo "--- BKSDCARD / BKCHARGE / BKCAM in config ---"
          grep -n 'BKSDCARD\|BKCHARGE\|BKCAM' src/obk_config.h

      - name: Diagnostics
        run: |
          mkdir -p diag
          cd obk
          { echo "=== guards of beken-specific drivers ==="
            for f in src/driver/drv_bk*.c src/driver/drv_sdcard*.c; do
              [ -f "$f" ] || continue
              echo "--- $f"; grep -m2 -n '^#if' "$f" || echo "(no #if)"
            done
            echo "=== BKCharge references outside its own file ==="
            grep -rn 'BKCharge' src --include=*.c --include=*.h | grep -v 'drv_bkCharge.c' || echo none
            echo "=== tail of obk_config.h ==="
            tail -25 src/obk_config.h
          } > ../diag/guards.txt 2>&1
          cat ../diag/guards.txt

      - name: Toolchain + Berry
        run: |
          SDK=$PWD/obk/sdk/beken_freertos_sdk
          TC=$SDK/toolchain
          mkdir -p $TC/.unpack
          tar -C $TC/.unpack --no-same-owner --no-same-permissions -xJf $TC/arm-none-eabi-gcc.tar.xz
          chmod -R u+w $TC/.unpack
          mv $TC/.unpack/arm-none-eabi $TC/arm-none-eabi
          $TC/arm-none-eabi/bin/arm-none-eabi-gcc --version | head -1
          cd obk
          mkdir -p libraries/berry/generate
          python3 ./libraries/berry/tools/coc/coc -o libraries/berry/generate \
            libraries/berry/src src/berry/modules -c include/berry_conf.h

      - name: Build
        continue-on-error: true
        run: |
          SDK=$PWD/obk/sdk/beken_freertos_sdk
          printf '#define CAM_FW_TAG "fw %s"\n' "${{ github.event.inputs.version }}" > obk/src/driver/drv_bkCam_version.h
          cd $SDK
          ARM_GCC_TOOLCHAIN="$SDK/toolchain/arm-none-eabi/bin/" \
            sh build.sh ${{ github.event.inputs.target }} ${{ github.event.inputs.version }} \
            > $GITHUB_WORKSPACE/build.log 2>&1 || true
          echo "===== ERRORS ====="
          grep -n -i 'fatal error\|error:\|Error [0-9]\|undefined reference\|not exist' $GITHUB_WORKSPACE/build.log | head -40 || true
          echo "===== last 40 ====="
          tail -40 $GITHUB_WORKSPACE/build.log
          echo "===== out ====="
          ls -la out/*.bin out/*.rbl 2>/dev/null || echo "no images"

      - name: Collect
        if: always()
        run: |
          mkdir -p result
          cp build.log patch.log result/ 2>/dev/null || true
          for f in obk/sdk/beken_freertos_sdk/out/*.bin obk/sdk/beken_freertos_sdk/out/*.rbl; do
            [ -f "$f" ] && cp "$f" result/ && echo "GOT: $f"
          done
          ls -la result/
          find result -name '*.bin' -printf '%s %p\n' 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bk7252-build
          path: |
            result/
            diag/
          if-no-files-found: warn
