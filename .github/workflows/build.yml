name: Build OpenBeken BK7252 1.18.321-cam5 (LFS + UART console + camera, cam5 I2C diagnostics)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Download pinned sources (OpenBeken 1.18.321 + SDK f5a64d4 + berry b9ce913)
        run: |
          mkdir -p app
          curl -fsSL -o /tmp/app.tar.gz https://github.com/openshwprojects/OpenBK7231T_App/archive/refs/tags/1.18.321.tar.gz
          tar -xzf /tmp/app.tar.gz -C app --strip-components=1
          rm -rf app/sdk/beken_freertos_sdk app/libraries/berry
          mkdir -p app/sdk/beken_freertos_sdk app/libraries/berry
          curl -fsSL -o /tmp/sdk.tar.gz https://github.com/NonPIayerCharacter/beken_freertos_sdk/archive/f5a64d4cda03bac6d885f4f30c27bbd3435c5e3a.tar.gz
          tar -xzf /tmp/sdk.tar.gz -C app/sdk/beken_freertos_sdk --strip-components=1
          curl -fsSL -o /tmp/berry.tar.gz https://github.com/berry-lang/berry/archive/b9ce913d9d43bb296d9604bc0cb4f2f68a6b703f.tar.gz
          tar -xzf /tmp/berry.tar.gz -C app/libraries/berry --strip-components=1
          echo "sources ready"

      - name: Write embedded BK7252 patch
        run: |
          cat > bk7252_118321_cam.patch <<'PATCH_EOF'
          --- a/platforms/BK723x/OpenBeken.mk
          +++ b/platforms/BK723x/OpenBeken.mk
          @@ -17,6 +17,17 @@
           else ifeq ($(CFG_SOC_NAME), 3)
           CCFLAGS += -DPLATFORM_BK7252
           CCFLAGS += -DENABLE_DRIVER_MDNS=1 -DLWIP_MDNS_RESPONDER=1 -DLWIP_NUM_NETIF_CLIENT_DATA=1
          +# enable LittleFS config storage (uses the unused OTA download partition 0x132000-0x1E0000)
          +CCFLAGS += -DENABLE_LITTLEFS=1
          +# enable BK7252 camera driver (DVP + hardware JPEG, SDK camera_intf)
          +CCFLAGS += -DENABLE_DRIVER_CAMERA_BK7252=1
          +INCLUDES += -I$(ROOT_DIR)/beken378/func/camera_intf
          +INCLUDES += -I$(ROOT_DIR)/beken378/func/video_transfer
          +INCLUDES += -I$(ROOT_DIR)/beken378/driver/jpeg
          +INCLUDES += -I$(ROOT_DIR)/beken378/driver/i2c
          +INCLUDES += -I$(ROOT_DIR)/beken378/driver/include
          +INCLUDES += -I$(ROOT_DIR)/beken378/os/include
          +APP_C += $(OBK_DIR)/driver/drv_camera_bk7252.c
           else ifeq ($(CFG_SOC_NAME), 5)
           CCFLAGS += -DPLATFORM_BK7231N
           else ifeq ($(CFG_SOC_NAME), 7)
          --- a/sdk/beken_freertos_sdk/beken378/beken_src.mk
          +++ b/sdk/beken_freertos_sdk/beken378/beken_src.mk
          @@ -626,10 +626,11 @@
           SRC_FUNC_C += ./beken378/func/utf8/conv_utf8.c
           
           # video / jpeg
          -ifeq ($CFG_USE_CAMERA_INTF), 1)
          +# BK7252 port fix: condition was written as ($CFG_USE_CAMERA_INTF) which never
          +# matched, so camera_intf never compiled; gc2145/video_transfer are not needed
          +# by the OpenBeken camera driver and only add flash/RAM
          +ifeq ($(CFG_USE_CAMERA_INTF), 1)
           SRC_FUNC_C += ./beken378/func/camera_intf/camera_intf.c
          -SRC_FUNC_C += ./beken378/func/camera_intf/camera_intf_gc2145.c
          -SRC_FUNC_C += ./beken378/func/video_transfer/video_transfer.c
           endif
           
           ifeq ($(CFG_LOW_VOLTAGE_PS), 1)
          --- a/sdk/beken_freertos_sdk/beken378/func/camera_intf/camera_intf_config.h
          +++ b/sdk/beken_freertos_sdk/beken378/func/camera_intf/camera_intf_config.h
          @@ -40,6 +40,10 @@
           #define HM_1055_DEV             (0xABC06)
           #define GC_2145_DEV             (0xABC07)
           
          +// BK7252 port: stock firmware of the A9 PTZ camera boots this sensor with
          +// gUsedCam=0xABC03 (vendor "GC0329" slot = GC0328C_DEV here); sensor chip ID
          +// reads 0xF0=0x07/0xF1=0x01 (GC-family clone), register map is GC0328C-like
          +// but with vendor-specific final values - switch tables here if frame is black
           #define USE_CAMERA              GC0328C_DEV
           
           #define PAS6329_DEV_ID          (0x40)
          --- a/sdk/beken_freertos_sdk/beken378/driver/i2c/i2c1.c
          +++ b/sdk/beken_freertos_sdk/beken378/driver/i2c/i2c1.c
          @@ -220,8 +220,11 @@
               sddev_control(ICU_DEV_NAME, CMD_ICU_INT_DISABLE, &param);
           }
           
          +volatile UINT32 i2c1_isr_count = 0;   // cam5 diagnostics: ISR dispatch check
          +
           static void i2c1_isr(void)
           {
          +    i2c1_isr_count++;
              unsigned long   i2c1_config;
              unsigned long   work_mode, ack_rx, sta, si;
           
          --- a/src/cmnds/cmd_main.c
          +++ b/src/cmnds/cmd_main.c
          @@ -769,6 +769,7 @@
           #if PLATFORM_BEKEN || PLATFORM_ARMINO
               char a;
               int i;
          +	int pos;
               int totalSize;
               char tmp[128];
           
          @@ -783,22 +784,41 @@
                       break;
                   }
               }
          -	if (totalSize < 2) {
          -		return;
          -	}
          -	// skip garbage data (should not happen)
          -	for (i = 0; i < totalSize; i++) {
          -		a = UART_GetByte(i);
          -		if (i + 1 < sizeof(tmp)) {
          -			tmp[i] = a;
          -			tmp[i + 1] = 0;
          -		}
          -		if (a == '\n') {
          +	// read the line byte by byte, echo it back and support backspace,
          +	// so typing commands in a terminal over the log UART is usable
          +	pos = 0;
          +	tmp[0] = 0;
          +	i = 0;
          +	while (i < totalSize) {
          +		a = UART_GetByte(0);
          +		UART_ConsumeBytes(1);
          +		i++;
          +		if (a == '\n' || a == '\r') {
                      break;
                  }
          +		if (a == 0x08 || a == 0x7F) {
          +			// backspace: erase last char locally and in the terminal
          +			if (pos > 0) {
          +				pos--;
          +				tmp[pos] = 0;
          +				UART_SendByte(0x08);
          +				UART_SendByte(' ');
          +				UART_SendByte(0x08);
          +			}
          +			continue;
          +		}
          +		if (a >= 32 && a < 127) {
          +			if (pos + 1 < (int)sizeof(tmp)) {
          +				tmp[pos++] = a;
          +				tmp[pos] = 0;
          +				// echo so the user sees what they type
          +				UART_SendByte(a);
          +			}
          +		}
          +	}
          +	if (pos > 0) {
          +		CMD_ExecuteCommand(tmp, 0);
              }
          -	UART_ConsumeBytes(i);
          -	CMD_ExecuteCommand(tmp, 0);
           #endif
           }
           void CMD_RunUartCmndIfRequired() {
          --- a/src/littlefs/our_lfs.h
          +++ b/src/littlefs/our_lfs.h
          @@ -66,6 +66,15 @@
           // end of OTA flash
           #define LFS_BLOCKS_END 0x1E0000
           
          +#elif PLATFORM_BK7252
          +// BK7251/BK7252 with beken_freertos_sdk on 2MB flash:
          +// app is 0x10000-0x121000, the OTA "download" partition is
          +// 0x132000-0x1E0000 and is never used by OpenBeken,
          +// vendor MAC/calibration data live above 0x1E0000
          +#define LFS_BLOCKS_START 0x132000
          +#define LFS_BLOCKS_START_MIN 0x132000
          +#define LFS_BLOCKS_END 0x1E0000
          +
           #elif PLATFORM_BL602 || PLATFORM_BL_NEW
           
           #define LFS_BLOCKS_START 0x0
          --- a/src/user_main.c
          +++ b/src/user_main.c
          @@ -1368,8 +1368,15 @@
               // don't create if it does not mount
               // do this for ST mode only, as it may be something in FS which is killing us,
               // and we may add a command to empty fs just be writing first sector?
          +#if PLATFORM_BK7252
          +	// on BK7251/BK7252 the LFS area (OTA download partition 0x132000-0x1E0000)
          +	// is blank on first boot, so format and mount right away,
          +	// otherwise 'lfs is absent' would stay forever
          +	init_lfs(1);
          +#else
               init_lfs(0);
           #endif
          +#endif
           
               PIN_SetGenericDoubleClickCallback(app_on_generic_dbl_click);
               ADDLOGF_DEBUG("Initialised other callbacks");
          @@ -1531,6 +1538,16 @@
               }
               CFG_InitAndLoad();
           
          +#if PLATFORM_BK7252
          +	// the camera exposes only its log UART (BK UART2). Without these flags
          +	// typed characters would be ignored: the console is gated by
          +	// OBK_FLAG_CMD_ACCEPT_UART_COMMANDS and, by default, listens on the
          +	// wrong port - OBK_FLAG_USE_SECONDARY_UART switches it to BK UART2,
          +	// the same port the logs are printed to
          +	CFG_SetFlag(OBK_FLAG_CMD_ACCEPT_UART_COMMANDS, true);
          +	CFG_SetFlag(OBK_FLAG_USE_SECONDARY_UART, true);
          +#endif
          +
           #if ENABLE_DRIVER_XIAOMI_COMPACT4
               // Keep motor hardware inert before normal driver startup and throughout safe mode.
               XiaomiCompact4_PreDriverSafetyInit(bSafeMode);
          @@ -1540,6 +1557,14 @@
               LFSAddCmds();
           #endif
           
          +#if ENABLE_DRIVER_CAMERA_BK7252
          +	// BK7252 DVP camera: register commands and http endpoints
          +	{
          +		extern void Camera_BK7252_Init(void);
          +		Camera_BK7252_Init();
          +	}
          +#endif
          +
               // only initialise certain things if we are not in AP mode
               if (!bSafeMode)
               {
          --- a/src/driver/drv_camera_bk7252.c
          +++ b/src/driver/drv_camera_bk7252.c
          @@ -0,0 +1,494 @@
          +// BK7252 camera driver for OpenBeken
          +// - DVP capture + hardware JPEG encoder via Beken camera_intf/EJPEG SDK modules
          +// - sensor probe over SCCB (I2C1), single frame snapshot and MJPEG stream over HTTP
          +//
          +// commands: camera_detect, camera_on, camera_off, camera_info, camera_reg
          +// http:     /camera.jpg  /camera.mjpg  /camview
          +#include "../obk_config.h"
          +
          +#if ENABLE_DRIVER_CAMERA_BK7252
          +
          +#include <string.h>
          +#include <stdio.h>
          +
          +#include "../new_common.h"
          +#include "../cmnds/cmd_public.h"
          +#include "../httpserver/new_http.h"
          +#include "../logging/logging.h"
          +
          +// Beken SDK headers (include paths come from beken_src.mk)
          +#include "drv_model_pub.h"
          +#include "i2c_pub.h"
          +#include "gpio_pub.h"
          +#include "mem_pub.h"
          +#include "uart_pub.h"
          +#include "intc_pub.h"
          +#include "camera_intf_pub.h"
          +#include "video_transfer.h"
          +#include "jpeg_encoder_pub.h"
          +
          +#define CAM_LOG(...) ADDLOG_INFO(LOG_FEATURE_CMD, __VA_ARGS__)
          +#define CAM_ERR(...) ADDLOG_ERROR(LOG_FEATURE_CMD, __VA_ARGS__)
          +
          +// DMA ring: EJPEG writes encoded jpeg stream here in node_len chunks
          +#define CAM_NODE_LEN            1024
          +#define CAM_NODE_COUNT          8
          +static UINT8 *cam_rxbuf = NULL;
          +
          +// ping-pong frame buffers: one accumulates the frame being received,
          +// the other holds the latest completed jpeg (safe to read over HTTP)
          +#define CAM_BUF_SIZE            (48 * 1024)
          +static UINT8 *cam_buf[2] = { NULL, NULL };
          +
          +// allocate once, firmware lifetime; handlers check for NULL
          +static int cam_buffers_init(void)
          +{
          +	if (cam_rxbuf != NULL) {
          +		return 0;
          +	}
          +	cam_rxbuf = (UINT8 *)os_malloc(CAM_NODE_LEN * CAM_NODE_COUNT);
          +	cam_buf[0] = (UINT8 *)os_malloc(CAM_BUF_SIZE);
          +	cam_buf[1] = (UINT8 *)os_malloc(CAM_BUF_SIZE);
          +	if (cam_rxbuf == NULL || cam_buf[0] == NULL || cam_buf[1] == NULL) {
          +		CAM_ERR("Camera: os_malloc failed for capture buffers");
          +		if (cam_rxbuf) { os_free(cam_rxbuf); cam_rxbuf = NULL; }
          +		if (cam_buf[0]) { os_free(cam_buf[0]); cam_buf[0] = NULL; }
          +		if (cam_buf[1]) { os_free(cam_buf[1]); cam_buf[1] = NULL; }
          +		return -1;
          +	}
          +	return 0;
          +}
          +
          +static TVIDEO_DESC_ST cam_desc;
          +static volatile int cam_started = 0;
          +static volatile int cam_starting = 0;
          +static UINT32 cam_ppi = QVGA_320_240;
          +static UINT32 cam_fps = TYPE_20FPS;
          +
          +// written from IRQ/timer context
          +static volatile UINT32 cam_acc_idx = 0;   // buffer index being filled
          +static volatile UINT32 cam_acc_len = 0;
          +static volatile UINT32 cam_overflow = 0;
          +static volatile UINT32 cam_latest_idx = 0;
          +static volatile UINT32 cam_latest_len = 0;
          +static volatile UINT32 cam_seq = 0;       // bumped once per complete frame
          +static UINT32 cam_frames_total = 0;
          +
          +// called from GDMA irq (node chunks) and ejpeg timer (final chunk with is_eof)
          +static void cam_rx_handler(void *curptr, UINT32 newlen, UINT32 is_eof, UINT32 frame_len)
          +{
          +	GLOBAL_INT_DECLARATION();
          +	(void)frame_len;
          +	if (newlen == 0) {
          +		return;
          +	}
          +	if (cam_buf[0] == NULL || cam_buf[1] == NULL) {
          +		return;
          +	}
          +	UINT32 idx = cam_acc_idx;
          +	UINT32 len = cam_acc_len;
          +	if (len + newlen > CAM_BUF_SIZE) {
          +		cam_overflow = 1;
          +		return;
          +	}
          +	memcpy(&cam_buf[idx][len], curptr, newlen);
          +	len += newlen;
          +	GLOBAL_INT_DISABLE();
          +	cam_acc_len = len;
          +	GLOBAL_INT_RESTORE();
          +}
          +
          +// camera_intf calls this after the frame end interrupt + 2ms delay timer
          +static void cam_end_handler(void)
          +{
          +	GLOBAL_INT_DECLARATION();
          +	UINT32 len = cam_acc_len;
          +	UINT32 idx = cam_acc_idx;
          +
          +	if (cam_overflow == 0 && len > 4) {
          +		cam_latest_idx = idx;
          +		cam_latest_len = len;
          +		cam_seq++;
          +	}
          +	cam_frames_total++;
          +	GLOBAL_INT_DISABLE();
          +	cam_acc_len = 0;
          +	cam_overflow = 0;
          +	cam_acc_idx = idx ^ 1;
          +	GLOBAL_INT_RESTORE();
          +}
          +
          +static int cam_start(void)
          +{
          +	if (cam_started) {
          +		return 0;
          +	}
          +	if (cam_starting) {
          +		return -1;
          +	}
          +	cam_starting = 1;
          +
          +	if (cam_buffers_init() != 0) {
          +		cam_starting = 0;
          +		return -2;
          +	}
          +
          +	memset(&cam_desc, 0, sizeof(cam_desc));
          +	cam_desc.rxbuf = cam_rxbuf;
          +	cam_desc.rxbuf_len = CAM_NODE_LEN * CAM_NODE_COUNT;
          +	cam_desc.node_len = CAM_NODE_LEN;
          +	cam_desc.rx_read_len = 0;
          +	cam_desc.sener_cfg = 0;
          +	CMPARAM_SET_PPI(cam_desc.sener_cfg, cam_ppi);
          +	CMPARAM_SET_FPS(cam_desc.sener_cfg, cam_fps);
          +	cam_desc.node_full_handler = cam_rx_handler;
          +	cam_desc.data_end_handler = cam_end_handler;
          +
          +	cam_acc_len = 0;
          +	cam_overflow = 0;
          +
          +	int ret = camera_intfer_init(&cam_desc);
          +	if (ret != 1) {
          +		CAM_ERR("Camera: camera_intfer_init failed %i (sensor missing?)", ret);
          +		cam_starting = 0;
          +		return ret;
          +	}
          +	cam_started = 1;
          +	cam_starting = 0;
          +	CAM_LOG("Camera: started, ppi=%i fps=%i", (int)cam_ppi, (int)cam_fps);
          +	return 0;
          +}
          +
          +static void cam_stop(void)
          +{
          +	if (!cam_started) {
          +		return;
          +	}
          +	camera_intfer_deinit();
          +	cam_started = 0;
          +	CAM_LOG("Camera: stopped");
          +}
          +
          +// wait for a complete frame, returns 0 on success
          +static int cam_wait_frame(UINT32 timeout_ms)
          +{
          +	UINT32 waited = 0;
          +	while (cam_seq == 0 || cam_latest_len == 0) {
          +		if (!cam_started || waited >= timeout_ms) {
          +			return -1;
          +		}
          +		rtos_delay_milliseconds(50);
          +		waited += 50;
          +	}
          +	return 0;
          +}
          +
          +// ---------- SCCB helpers (own i2c session, use while camera is stopped) ----------
          +
          +static int cam_sccb_open(DD_HANDLE *h)
          +{
          +	UINT32 status = 0;
          +	*h = ddev_open(I2C1_DEV_NAME, &status, 0);
          +	if (*h == DD_HANDLE_UNVALID) {
          +		CAM_ERR("Camera: open I2C1 failed");
          +		return -1;
          +	}
          +	// route I2C1 pads to the camera FPC ("20pin to 24pin" mux) - the sensor
          +	// stays silent (no ack) without this, stock does the same in
          +	// camera_intfer_init (camera_intf.c)
          +	UINT32 io_output_en = 1;
          +	ddev_control(*h, I2C1_CMD_SET_IO_OUTPUT, &io_output_en);
          +	return 0;
          +}
          +
          +static int cam_sccb_read_reg(DD_HANDLE h, UINT8 slave, UINT8 reg, UINT8 *val)
          +{
          +	I2C_OP_ST op;
          +	int rc;
          +	// cam5: zero the op struct - stray fields previously leaked into the driver
          +	os_memset(&op, 0, sizeof(op));
          +	op.addr_width = ADDR_WIDTH_8;
          +	op.salve_id = slave;
          +	op.op_addr = reg;
          +	rc = ddev_read(h, (char *)val, 1, (UINT32)&op);
          +	return rc != 0;
          +}
          +
          +static int cam_sccb_write_reg(DD_HANDLE h, UINT8 slave, UINT8 reg, UINT8 val)
          +{
          +	I2C_OP_ST op;
          +	int rc;
          +	os_memset(&op, 0, sizeof(op));
          +	op.addr_width = ADDR_WIDTH_8;
          +	op.salve_id = slave;
          +	op.op_addr = reg;
          +	rc = ddev_write(h, (char *)&val, 1, (UINT32)&op);
          +	return rc != 0;
          +}
          +
          +// ---------- cam5 I2C1 diagnostics ----------
          +// legacy i2c1.c: rc=1 means EITHER no-ack (ISR ran, NACK branch) OR timeout
          +// (ISR never ran, TransDone stuck 0) - the return code cannot tell them apart.
          +// i2c1_isr_count (added to sdk i2c1.c) shows whether the ISR dispatches at all.
          +extern volatile UINT32 i2c1_isr_count;
          +// legacy register map (SOC_BK7221U): CONFIG +0, DAT +4
          +// CONFIG bits: ENSMB=0 STA=1 STO=2 ACK_TX=3 TX_MODE=4 FREQ_DIV=6..15
          +//              SI=16 ACK_RX=17 ACK_REQ=18 BUSY=19
          +#define CAM_I2C1_REG_CONFIG  (*(volatile UINT32 *)0x00802300)
          +#define CAM_I2C1_REG_DAT     (*(volatile UINT32 *)0x00802304)
          +
          +static void cam_i2c_diag(DD_HANDLE h, UINT8 slave, int wr_rc, int rd_rc)
          +{
          +	UINT32 si, ackrx, busy, m20 = 0xFFFFFFFF, m21 = 0xFFFFFFFF;
          +
          +	si = ddev_control(h, I2C1_CMD_GET_SMBUS_INTERRUPT, 0);
          +	ackrx = ddev_control(h, I2C1_CMD_GET_ACK_RX, 0);
          +	busy = ddev_control(h, I2C1_CMD_GET_SMBUS_BUSY, 0);
          +	gpio_get_config(20, &m20);
          +	gpio_get_config(21, &m21);
          +	CAM_LOG("CAM5DIAG addr=0x%02X wr=%i rd=%i ISRcnt=%u SI=%u ACKRX=%u BUSY=%u CFG=0x%08X DAT=0x%08X pad20=%u pad21=%u",
          +		slave, wr_rc, rd_rc, (unsigned)i2c1_isr_count,
          +		(unsigned)si, (unsigned)ackrx, (unsigned)busy,
          +		CAM_I2C1_REG_CONFIG, CAM_I2C1_REG_DAT,
          +		(unsigned)(m20 & 0xFF), (unsigned)(m21 & 0xFF));
          +	CAM_LOG("CAM5DIAG legend: ISRcnt=0 -> ISR not dispatched (clock/INTC); ISRcnt>0+ACKRX=0 -> NACK (sensor/bus); "
          +		"SI=1 -> int stuck; CFG bits19=BUSY 17=ACKRX 16=SI 15:6=FREQ_DIV 4=TX 0=ENSMB; pad 1=I2C1-mux 2=JTAG 0=GPIO");
          +}
          +
          +static const UINT8 cam_probe_addrs[] = {
          +	0x31, 0x21, 0x6E, 0x24, 0x3C, 0x40, 0x60, 0x20, 0x30, 0x36, 0x10, 0x1A
          +};
          +
          +static const char *cam_guess_sensor(UINT8 id)
          +{
          +	switch (id) {
          +	case 0x07: return "GC0329-family clone (A9 board, SCCB 0x31)";
          +	case 0x9B: return "GC0308?";
          +	case 0x9D: return "GC0328/GC0329?";
          +	case 0x9E: return "GC0309?";
          +	case 0xB8: return "GC0311?";
          +	default: return "unknown";
          +	}
          +}
          +
          +static void CMD_Camera_Detect(const void *context, const char *cmd, const char *args, int cmdFlags)
          +{
          +	DD_HANDLE h = DD_HANDLE_UNVALID;
          +	int i;
          +	UINT8 data;
          +	int found = 0;
          +
          +	if (cam_started) {
          +		CAM_ERR("Camera: stop it first (camera_off)");
          +		return;
          +	}
          +	if (cam_sccb_open(&h)) {
          +		return;
          +	}
          +	camera_power_on();
          +	rtos_delay_milliseconds(30);
          +
          +	CAM_LOG("Camera: probing SCCB bus (I2C1), %i addresses (0x31 first)", (int)(sizeof(cam_probe_addrs)));
          +	for (i = 0; i < sizeof(cam_probe_addrs); i++) {
          +		UINT8 slave = cam_probe_addrs[i];
          +		UINT8 id = 0, id2 = 0, r0 = 0, r1 = 0;
          +		int wr_rc = 0, rd_rc = 0;
          +		// one retry: SCCB over the FPC mux occasionally NAKs the first try
          +		rd_rc = cam_sccb_read_reg(h, slave, 0xF0, &id);
          +		if (rd_rc != 0) {
          +			rtos_delay_milliseconds(5);
          +			rd_rc = cam_sccb_read_reg(h, slave, 0xF0, &id);
          +			if (rd_rc != 0) {
          +				ADDLOG_DEBUG(LOG_FEATURE_CMD, "Camera: device 0x%02X: no ack", slave);
          +				// cam5: dump controller/bus state once, on the first probed address
          +				if (slave == 0x31) {
          +					wr_rc = cam_sccb_write_reg(h, slave, 0xFC, 0x16);
          +					cam_i2c_diag(h, slave, wr_rc, rd_rc);
          +				}
          +				continue;
          +			}
          +		}
          +		found++;
          +		cam_sccb_read_reg(h, slave, 0xF1, &id2);
          +		cam_sccb_read_reg(h, slave, 0x00, &r0);
          +		cam_sccb_read_reg(h, slave, 0x01, &r1);
          +		CAM_LOG("Camera: device 0x%02X: ID 0xF0=0x%02X 0xF1=0x%02X reg00=0x%02X reg01=0x%02X (%s)",
          +			slave, id, id2, r0, r1, cam_guess_sensor(id));
          +	}
          +	data = data;
          +	ddev_close(h);
          +
          +	if (found == 0) {
          +		CAM_ERR("Camera: no device answered (0x31 incl). Full init test anyway:");
          +	} else {
          +		CAM_LOG("Camera: probe done, %i device(s). Now running FULL init (vendor path):", found);
          +	}
          +
          +	// full bring-up exactly like the stock firmware boot: camera_power_on ->
          +	// ejpeg cfg -> I2C1 open -> vendor init table (every write is ACK-checked)
          +	// -> leaves the camera running on success, ready for /camera.jpg
          +	if (cam_start() == 0) {
          +		CAM_LOG("Camera: FULL INIT OK - all table writes ACKed, camera running. Open /camera.jpg or /camview");
          +	} else {
          +		CAM_ERR("Camera: full init FAILED - see camera_intfer_init error code above");
          +	}
          +}
          +
          +static void CMD_Camera_On(const void *context, const char *cmd, const char *args, int cmdFlags)
          +{
          +	Tokenizer_TokenizeString(args, 0);
          +	int n = Tokenizer_GetArgsCount();
          +	if (n > 0) {
          +		if (!stricmp(Tokenizer_GetArg(0), "vga")) {
          +			cam_ppi = VGA_640_480;
          +		} else {
          +			cam_ppi = QVGA_320_240;
          +		}
          +	}
          +	if (n > 1) {
          +		int fps = Tokenizer_GetArgInteger(1);
          +		if (fps <= 5) cam_fps = TYPE_5FPS;
          +		else if (fps <= 10) cam_fps = TYPE_10FPS;
          +		else if (fps <= 20) cam_fps = TYPE_20FPS;
          +		else cam_fps = TYPE_30FPS;
          +	}
          +	cam_start();
          +}
          +
          +static void CMD_Camera_Off(const void *context, const char *cmd, const char *args, int cmdFlags)
          +{
          +	cam_stop();
          +}
          +
          +static void CMD_Camera_Info(const void *context, const char *cmd, const char *args, int cmdFlags)
          +{
          +	CAM_LOG("Camera: started=%i ppi=%i fps=%i frames=%i seq=%i lastLen=%i overflow=%i (buf %i KB x2)",
          +		cam_started, (int)cam_ppi, (int)cam_fps, (int)cam_frames_total, (int)cam_seq,
          +		(int)cam_latest_len, (int)cam_overflow, CAM_BUF_SIZE / 1024);
          +}
          +
          +static void CMD_Camera_Reg(const void *context, const char *cmd, const char *args, int cmdFlags)
          +{
          +	DD_HANDLE h = DD_HANDLE_UNVALID;
          +	Tokenizer_TokenizeString(args, 0);
          +	if (Tokenizer_GetArgsCount() < 1) {
          +		CAM_ERR("Usage: camera_reg <addr> [value] - SCCB reg of sensor, e.g. camera_reg 0xF0");
          +		return;
          +	}
          +	if (cam_started) {
          +		CAM_ERR("Camera: camera_reg conflicts with running camera, use camera_off first");
          +		return;
          +	}
          +	UINT8 slave = 0x21; // default GC03xx SCCB address
          +	UINT16 reg = (UINT16)Tokenizer_GetArgInteger(0);
          +	UINT8 val = 0;
          +	if (cam_sccb_open(&h)) {
          +		return;
          +	}
          +	camera_power_on();
          +	rtos_delay_milliseconds(10);
          +	if (Tokenizer_GetArgsCount() >= 2) {
          +		val = (UINT8)Tokenizer_GetArgInteger(1);
          +		cam_sccb_write_reg(h, slave, (UINT8)reg, val);
          +		rtos_delay_milliseconds(5);
          +	}
          +	UINT8 rd = 0;
          +	if (cam_sccb_read_reg(h, slave, (UINT8)reg, &rd) == 0) {
          +		CAM_LOG("Camera: sensor reg 0x%02X = 0x%02X (wrote 0x%02X)", reg, rd, val);
          +	} else {
          +		CAM_ERR("Camera: sensor reg 0x%02X read failed (no ack)", reg);
          +	}
          +	ddev_close(h);
          +}
          +
          +// ---------- HTTP ----------
          +
          +// sends jpeg frame directly on the socket, bypassing the small reply buffer
          +static int http_camera_jpg(http_request_t *request)
          +{
          +	char hdr[128];
          +	if (cam_start() != 0 && !cam_started) {
          +		poststr(request, "camera start failed");
          +		poststr(request, NULL);
          +		return 0;
          +	}
          +	if (cam_wait_frame(4000)) {
          +		poststr(request, "no frame yet");
          +		poststr(request, NULL);
          +		return 0;
          +	}
          +	UINT32 len = cam_latest_len;
          +	int n = snprintf(hdr, sizeof(hdr),
          +		"HTTP/1.1 200 OK\r\nContent-Type: image/jpeg\r\nContent-Length: %u\r\nConnection: close\r\n\r\n",
          +		(unsigned)len);
          +	send(request->fd, hdr, n, 0);
          +	send(request->fd, cam_buf[cam_latest_idx], len, 0);
          +	return 0; // already sent everything
          +}
          +
          +static int http_camera_mjpg(http_request_t *request)
          +{
          +	char hdr[160];
          +	UINT32 seq;
          +	int maxFrames = 18000; // ~5 min at 60fps of our pacing
          +
          +	if (cam_start() != 0 && !cam_started) {
          +		poststr(request, "camera start failed");
          +		poststr(request, NULL);
          +		return 0;
          +	}
          +	int n = snprintf(hdr, sizeof(hdr),
          +		"HTTP/1.1 200 OK\r\nContent-Type: multipart/x-mixed-replace; boundary=frame\r\nConnection: close\r\n\r\n");
          +	send(request->fd, hdr, n, 0);
          +
          +	while (maxFrames-- > 0) {
          +		if (cam_wait_frame(4000)) {
          +			break;
          +		}
          +		seq = cam_seq;
          +		UINT32 len = cam_latest_len;
          +		n = snprintf(hdr, sizeof(hdr),
          +			"--frame\r\nContent-Type: image/jpeg\r\nContent-Length: %u\r\n\r\n",
          +			(unsigned)len);
          +		if (send(request->fd, hdr, n, 0) <= 0) break;
          +		if (send(request->fd, cam_buf[cam_latest_idx], len, 0) <= 0) break;
          +		if (send(request->fd, "\r\n", 2, 0) <= 0) break;
          +		// wait for the NEXT frame
          +		while (cam_seq == seq && cam_started && maxFrames > 0) {
          +			rtos_delay_milliseconds(30);
          +			maxFrames--;
          +		}
          +	}
          +	return 0;
          +}
          +
          +static int http_camera_view(http_request_t *request)
          +{
          +	http_setup(request, httpMimeTypeHTML);
          +	poststr(request, "<html><head><title>BK7252 camera</title></head><body>");
          +	poststr(request, "<h3>BK7252 camera</h3>");
          +	poststr(request, "<img src=\"/camera.mjpg\" width=\"640\" "
          +		"onerror=\"this.onerror=null;this.src='/camera.jpg?'+Date.now();\">");
          +	poststr(request, "<p><a href=\"/camera.jpg\">single frame</a> | "
          +		"<a href=\"/\">index</a></p>");
          +	poststr(request, "</body></html>");
          +	poststr(request, NULL);
          +	return 0;
          +}
          +
          +void Camera_BK7252_Init(void)
          +{
          +	CMD_RegisterCommand("camera_detect", CMD_Camera_Detect, NULL);
          +	CMD_RegisterCommand("camera_on", CMD_Camera_On, NULL);
          +	CMD_RegisterCommand("camera_off", CMD_Camera_Off, NULL);
          +	CMD_RegisterCommand("camera_info", CMD_Camera_Info, NULL);
          +	CMD_RegisterCommand("camera_reg", CMD_Camera_Reg, NULL);
          +
          +	HTTP_RegisterCallback("/camera.jpg", HTTP_GET, http_camera_jpg, 0);
          +	HTTP_RegisterCallback("/camera.mjpg", HTTP_GET, http_camera_mjpg, 0);
          +	HTTP_RegisterCallback("/camview", HTTP_GET, http_camera_view, 0);
          +
          +	ADDLOG_INFO(LOG_FEATURE_CMD, "Camera: BK7252 cam5-i2cdiag driver registered (camera_detect /camera.jpg /camview)");
          +}
          +
          +#endif // ENABLE_DRIVER_CAMERA_BK7252

          PATCH_EOF
          wc -c bk7252_118321_cam.patch

      - name: Apply patch and verify key lines
        run: |
          cd app
          git apply --verbose ../bk7252_118321_cam.patch
          grep -q "DENABLE_LITTLEFS=1" platforms/BK723x/OpenBeken.mk
          grep -q "PLATFORM_BK7252" src/littlefs/our_lfs.h
          grep -q "ENABLE_DRIVER_CAMERA_BK7252" platforms/BK723x/OpenBeken.mk
          grep -q "camera_intfer_init" sdk/beken_freertos_sdk/beken378/beken_src.mk
          grep -q "gc0329v_init_talbe" sdk/beken_freertos_sdk/beken378/func/camera_intf/camera_intf.h
          grep -q "GC0329V_DEV_ID" sdk/beken_freertos_sdk/beken378/func/camera_intf/camera_intf.c
          grep -q "i2c1_isr_count" sdk/beken_freertos_sdk/beken378/driver/i2c/i2c1.c
          grep -q "cam5-i2cdiag" src/driver/drv_camera_bk7252.c
          test -f src/driver/drv_camera_bk7252.c
          echo "patch applied and verified"

      - name: Berry prebuild (generate string tables)
        run: |
          cd app
          mkdir -p libraries/berry/generate
          python3 libraries/berry/tools/coc/coc -o libraries/berry/generate libraries/berry/src src/berry/modules -c include/berry_conf.h

      - name: Extract bundled ARM toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tc"
          tar -xJf app/sdk/beken_freertos_sdk/toolchain/arm-none-eabi-gcc.tar.xz -C "$RUNNER_TEMP/tc"
          GCC_PATH="$(dirname "$(find "$RUNNER_TEMP/tc" -name arm-none-eabi-gcc | head -1)")"
          echo "GCC_PATH=$GCC_PATH" >> "$GITHUB_ENV"
          "$GCC_PATH/arm-none-eabi-gcc" --version | head -1

      - name: Build bk7251
        run: |
          export ARM_GCC_TOOLCHAIN="$GCC_PATH/"
          export PATH="$GCC_PATH:$PATH"
          cd app/sdk/beken_freertos_sdk
          make bk7251 -j"$(nproc)" USER_SW_VER="1.18.321-cam5" OBK_DIR="../../src"
          ls -la out/

      - name: Verify build markers (raw out/bk7251.bin is not CRC-interleaved, strings work)
        run: |
          cd app/sdk/beken_freertos_sdk
          B=out/bk7251.bin
          grep -aq "cam5-i2cdiag" "$B"
          grep -aq "CAM5DIAG" "$B"
          grep -aq "GC0329V init finish" "$B"
          grep -aq "1.18.321-cam5" "$B"
          test -s out/bk7251_UA.bin
          echo "markers verified"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp app/sdk/beken_freertos_sdk/out/bk7251_QIO.bin  artifacts/OpenBK7252_QIO_1.18.321-cam5.bin
          cp app/sdk/beken_freertos_sdk/out/bk7251_UA.bin   artifacts/OpenBK7252_UA_1.18.321-cam5.bin
          md5sum artifacts/* | tee artifacts/md5sums.txt
          ls -la artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenBK7252_1.18.321-cam5
          path: artifacts/
