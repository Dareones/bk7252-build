name: Build OpenBeken BK7252 1.18.321-cam14 (camera + HTTP diag + OTA rbl)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Download pinned sources (OpenBeken 1.18.321 + SDK f5a64d4 + berry b9ce913)
        run: |
          mkdir -p app
          curl -fsSL -o /tmp/app.tar.gz https://github.com/openshwprojects/OpenBK7231T_App/archive/refs/tags/1.18.321.tar.gz
          echo "07fe1498dd5188899b0323fee850d4cabac498b307b26d92862f9d7fdec8ad63  /tmp/app.tar.gz" | sha256sum -c -
          tar -xzf /tmp/app.tar.gz -C app --strip-components=1
          rm -rf app/sdk/beken_freertos_sdk app/libraries/berry
          mkdir -p app/sdk/beken_freertos_sdk app/libraries/berry
          curl -fsSL -o /tmp/sdk.tar.gz https://github.com/NonPIayerCharacter/beken_freertos_sdk/archive/f5a64d4cda03bac6d885f4f30c27bbd3435c5e3a.tar.gz
          tar -xzf /tmp/sdk.tar.gz -C app/sdk/beken_freertos_sdk --strip-components=1
          curl -fsSL -o /tmp/berry.tar.gz https://github.com/berry-lang/berry/archive/b9ce913d9d43bb296d9604bc0cb4f2f68a6b703f.tar.gz
          tar -xzf /tmp/berry.tar.gz -C app/libraries/berry --strip-components=1
          echo "sources ready"

      - name: Extract cam12 patch blob from repo data file
        run: |
          set -euo pipefail
          SRC=build_bk7252_1.18.321-cam12.yml
          test -f "$SRC" || { echo "ERROR: first upload build_bk7252_1.18.321-cam12.yml to repo root via Add file -> Upload files"; exit 1; }
          sed -n "/<<'B64_EOF'/,/^ *B64_EOF/p" "$SRC" | sed '1d;$d' > /tmp/patch.gz.b64
          base64 -di /tmp/patch.gz.b64 | gunzip > bk7252_118321_cam.patch
          echo "c0afac18e976814c2d884ea37013174848d20b812dbdeaa04f0152f3d6bf7ff5  bk7252_118321_cam.patch" | sha256sum -c -
          wc -c bk7252_118321_cam.patch

      - name: Apply patch and verify key lines
        run: |
          cd app
          git apply --verbose ../bk7252_118321_cam.patch
          grep -q "DENABLE_LITTLEFS=1" platforms/BK723x/OpenBeken.mk
          grep -q "PLATFORM_BK7252" src/littlefs/our_lfs.h
          grep -q "ENABLE_DRIVER_CAMERA_BK7252" platforms/BK723x/OpenBeken.mk
          grep -q "gc0329v_init_talbe" sdk/beken_freertos_sdk/beken378/func/camera_intf/camera_intf.h
          grep -q "GC0329V_DEV_ID" sdk/beken_freertos_sdk/beken378/func/camera_intf/camera_intf.c
          grep -q "cam12-ppsweep" src/driver/drv_camera_bk7252.c
          echo "patch applied and verified"

      - name: cam13 delta - forced I2C1 mux + pad-truth command
        run: |
          cd app
          python3 - <<'PY'
          p='src/driver/drv_camera_bk7252.c'
          s=open(p, encoding='latin-1').read()
          helper = """
          // cam13: force GPIO20/21 function field to PERIAL_MODE_1 (I2C1) and pad cfg 0x78
          static void cam_force_i2c1_mux(void)
          {
              volatile UINT32 *f2 = (volatile UINT32 *)0x008028B8u; // REG_GPIO_FUNC_CFG_2
              UINT32 v = *f2;
              *f2 = (v & ~(0xFu << 8)); // bits 8..11 = pins 20,21 -> mode 0 = I2C1
              cam_bb_cfg(20, 0x78);
              cam_bb_cfg(21, 0x78);
              CAM_LOG("MUXFORCE FCFG2 %08X -> %08X P20=%02X P21=%02X",
                  (unsigned)v, (unsigned)*f2,
                  (unsigned)(*cam_bb_pcfg(20) & 0xFFu), (unsigned)(*cam_bb_pcfg(21) & 0xFFu));
          }
          """
          a='static int cam_bb_begin(void)'; assert a in s, 'anchor begin'
          s=s.replace(a, helper+'\n'+a, 1)
          a2='\tif (cam_bb_pushpull) {'; assert a2 in s, 'anchor pp'
          s=s.replace(a2, '\tcam_force_i2c1_mux();\n'+a2, 1)
          a3='\tint ret = camera_intfer_init(&cam_desc);'; assert a3 in s, 'anchor init'
          s=s.replace(a3, '\tcam_force_i2c1_mux();\n'+a3, 1)
          padtruth = """
          // cam13: pad-truth over HTTP-safe command path
          static void CMD_Camera_PadTruth(const void *context, const char *cmd, const char *args, int cmdFlags)
          {
              static const UINT32 cfgs[] = { 0x78, 0x3C, 0x34, 0x0C, 0x44, 0x08, 0x00, 0x02 };
              volatile UINT32 *f2 = (volatile UINT32 *)0x008028B8u;
              int i;
              CAM_LOG("PADTRUTH FCFG2 before=%08X", (unsigned)*f2);
              *f2 = (*f2 & ~(0xFu << 8));
              CAM_LOG("PADTRUTH FCFG2 forced=%08X", (unsigned)*f2);
              for (i = 0; i < (int)(sizeof(cfgs)/sizeof(cfgs[0])); i++) {
                  UINT32 c = cfgs[i];
                  cam_bb_cfg(20, c); cam_bb_cfg(21, c);
                  cam_bb_half(); cam_bb_half();
                  CAM_LOG("PADTRUTH cfg=%02X scl20=%u sda21=%u",
                      (unsigned)c, (unsigned)cam_bb_level(20), (unsigned)cam_bb_level(21));
              }
              cam_bb_cfg(20, 0x34); cam_bb_cfg(21, 0x34);
              for (i = 0; i < 10; i++) {
                  rtos_delay_milliseconds(20);
                  CAM_LOG("PADTRUTH t=%ims scl20=%u sda21=%u", (i+1)*20,
                      (unsigned)cam_bb_level(20), (unsigned)cam_bb_level(21));
              }
              cam_bb_cfg(20, 0x3C); cam_bb_cfg(21, 0x3C);
              CAM_LOG("PADTRUTH done; now run: camera_detect");
          }
          """
          a4='static void CMD_Camera_Detect('; assert a4 in s, 'anchor detect'
          s=s.replace(a4, padtruth+'\n'+a4, 1)
          a5='\tCMD_RegisterCommand("camera_detect", CMD_Camera_Detect, NULL);'; assert a5 in s, 'anchor reg'
          s=s.replace(a5, a5+'\n\tCMD_RegisterCommand("camera_padtruth", CMD_Camera_PadTruth, NULL);', 1)
          open(p,'w',encoding='latin-1').write(s)
          print('cam13 delta applied')
          PY
          grep -q 'cam_force_i2c1_mux' src/driver/drv_camera_bk7252.c
          grep -q 'camera_padtruth' src/driver/drv_camera_bk7252.c

      - name: cam14 delta - HTTP /camdiag (no UART needed)
        run: |
          cd app
          python3 - <<'PY'
          p='src/driver/drv_camera_bk7252.c'
          s=open(p, encoding='latin-1').read()
          handler = """
          // cam14: full pad-truth + probe over HTTP, safe pins only (20/21), no motors
          static int http_cam_diag(http_request_t *request)
          {
              char lb[96];
              int i, k;
              static const UINT32 cfgs[] = { 0x78, 0x3C, 0x34, 0x0C, 0x44, 0x08, 0x00, 0x02 };
              http_setup(request, "text/plain");
              poststr(request, "CAM14 DIAG start\\n");
              cam_force_i2c1_mux();
              for (i = 0; i < (int)(sizeof(cfgs)/sizeof(cfgs[0])); i++) {
                  UINT32 c = cfgs[i];
                  cam_bb_cfg(20, c); cam_bb_cfg(21, c);
                  cam_bb_half(); cam_bb_half();
                  snprintf(lb, sizeof(lb), "cfg=%02X scl20=%u sda21=%u\\n",
                      (unsigned)c, (unsigned)cam_bb_level(20), (unsigned)cam_bb_level(21));
                  poststr(request, lb);
              }
              cam_bb_cfg(20, 0x34); cam_bb_cfg(21, 0x34);
              for (i = 0; i < 6; i++) {
                  rtos_delay_milliseconds(20);
                  snprintf(lb, sizeof(lb), "t=%dms scl20=%u sda21=%u\\n", (i+1)*20,
                      (unsigned)cam_bb_level(20), (unsigned)cam_bb_level(21));
                  poststr(request, lb);
              }
              cam_bb_pushpull = 0;
              cam_bb_set_pins(20, 21);
              if (cam_bb_begin() == 0) {
                  poststr(request, "bus released: probing addresses\\n");
                  for (k = 0; k < (int)sizeof(cam_probe_addrs); k++) {
                      UINT8 id = 0, id2 = 0;
                      if (cam_bb_read_reg(cam_probe_addrs[k], 0xF0, &id)) {
                          cam_bb_read_reg(cam_probe_addrs[k], 0xF1, &id2);
                          snprintf(lb, sizeof(lb), "HIT addr=%02X F0=%02X F1=%02X (%s)\\n",
                              cam_probe_addrs[k], id, id2, cam_guess_sensor(id));
                          poststr(request, lb);
                      } else {
                          snprintf(lb, sizeof(lb), "NA addr=%02X\\n", cam_probe_addrs[k]);
                          poststr(request, lb);
                      }
                  }
              } else {
                  poststr(request, "bus HELD LOW after release (external clamp)\\n");
              }
              cam_bb_set_pins(20, 21);
              poststr(request, "CAM14 DIAG end\\n");
              poststr(request, NULL);
              return 0;
          }
          """
          a='void Camera_BK7252_Init(void)'; assert a in s, 'anchor init fn'
          s=s.replace(a, handler+'\n'+a, 1)
          a2='\tHTTP_RegisterCallback("/camview", HTTP_GET, http_camera_view, 0);'; assert a2 in s, 'anchor http reg'
          s=s.replace(a2, a2+'\n\tHTTP_RegisterCallback("/camdiag", HTTP_GET, http_cam_diag, 0);', 1)
          open(p,'w',encoding='latin-1').write(s)
          print('cam14 delta applied')
          PY
          grep -q 'http_cam_diag' src/driver/drv_camera_bk7252.c
          grep -q '"/camdiag"' src/driver/drv_camera_bk7252.c

      - name: Berry prebuild (generate string tables)
        run: |
          cd app
          mkdir -p libraries/berry/generate
          python3 libraries/berry/tools/coc/coc -o libraries/berry/generate libraries/berry/src src/berry/modules -c include/berry_conf.h

      - name: Extract bundled ARM toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/tc"
          tar -xJf app/sdk/beken_freertos_sdk/toolchain/arm-none-eabi-gcc.tar.xz -C "$RUNNER_TEMP/tc"
          GCC_PATH="$(dirname "$(find "$RUNNER_TEMP/tc" -name arm-none-eabi-gcc | head -1)")"
          echo "GCC_PATH=$GCC_PATH" >> "$GITHUB_ENV"
          "$GCC_PATH/arm-none-eabi-gcc" --version | head -1

      - name: Build bk7251
        run: |
          export ARM_GCC_TOOLCHAIN="$GCC_PATH/"
          export PATH="$GCC_PATH:$PATH"
          cd app/sdk/beken_freertos_sdk
          make bk7251 -j"$(nproc)" USER_SW_VER="1.18.321-cam14" OBK_DIR="../../src"
          ls -la out/

      - name: Pack OTA rbl (same tool/keys as official build.sh)
        run: |
          cd app/sdk/beken_freertos_sdk
          test -s out/bsp.bin
          chmod +x tools/rtt_ota/rt_ota_packaging_tool_cli
          ./tools/rtt_ota/rt_ota_packaging_tool_cli \
            -f ./out/bsp.bin -o ./out/app.rbl -p app -c gzip -s aes \
            -k 0123456789ABCDEF0123456789ABCDEF -i 0123456789ABCDEF \
            -v 1.18.321-cam14
          test -s out/app.rbl

      - name: Verify build markers
        run: |
          cd app/sdk/beken_freertos_sdk
          B=out/bk7251.bin
          grep -aq "cam12-ppsweep" "$B"
          grep -aq "PADTRUTH" "$B"
          grep -aq "camdiag" "$B"
          grep -aq "1.18.321-cam14" "$B"
          test -s out/bk7251_UA.bin
          echo "markers verified"

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp app/sdk/beken_freertos_sdk/out/bk7251_UA.bin artifacts/OpenBK7252_UA_1.18.321-cam14.bin
          cp app/sdk/beken_freertos_sdk/out/app.rbl      artifacts/OpenBK7252_1.18.321-cam14.rbl
          md5sum artifacts/* | tee artifacts/md5sums.txt
          ls -la artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenBK7252_1.18.321-cam14
          path: artifacts/
