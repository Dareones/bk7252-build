name: BK7252U GC0329 CAM7 I2C inner-address fix firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: Firmware version tag
        required: true
        type: string
        default: 1.18.321-cam7-i2c-ia

permissions:
  contents: read

concurrency:
  group: bk7252u-camera-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      OBK_COMMIT: 168cba55
      EXPECTED_SDK_PREFIX: f5a64d4

    steps:
      - name: Validate inputs and prepare diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid version string: $VERSION" >&2
            exit 2
          fi
          mkdir -p "$GITHUB_WORKSPACE/result"
          printf 'version=%s\n' "$VERSION" > "$GITHUB_WORKSPACE/result/build-info.txt"

