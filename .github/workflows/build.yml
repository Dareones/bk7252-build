name: BK7252U camera build (Safe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string'
        default: '1.18.321-cam5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 patch xz-utils make git wget libc6-i386 lib32z1 lib32stdc++6

      - name: Clone OpenBeken (pinned)
        run: |
          git clone -q https://github.com/openshwprojects/OpenBK7231T_App.git obk
          cd obk
          git checkout -q 168cba55
          git submodule update --init --depth 1 sdk/beken_freertos_sdk libraries/berry
          git clone -q https://github.com/pingwiner/bk7252n-camera.git ../cam

      - name: Official prebuild
        run: |
          cd obk
          make prebuild_OpenBK7252 > ../prebuild.log 2>&1 || true

      - name: Apply camera patch
        run: |
          cd obk
          patch -p1 --forward --no-backup-if-mismatch < ../cam/openbk-port/bk7252n-camera-openbk.patch > ../patch.log 2>&1 || true
          echo "Patch applied. Checking for rejects:"
          find . -name '*.rej' || echo "No rejects."

      - name: Fix SDK build issues (Safe fixes only)
        run: |
          cd obk/sdk/beken_freertos_sdk
          
          # 1. Фикс сломанного условия в Makefile (без этого camera_intf.c не компилируется)
          sed -i 's/ifeq ($CFG_USE_CAMERA_INTF), 1)/ifeq ($(CFG_USE_CAMERA_INTF),1)/' beken378/beken_src.mk
          
          # 2. Отключаем JTAG-фильтр, чтобы он не блокировал GPIO20/21 для I2C1
          sed -i 's/static int gpio_ops_filter_flag = 0;/static int gpio_ops_filter_flag = 1;/' beken378/driver/gpio/gpio.c
          
          echo "SDK fixes applied."

      - name: Build firmware
        run: |
          cd obk
          # Используем официальную цель OpenBK7252, которая корректно вызывает build.sh bk7251
          make APP_VERSION=${{ github.event.inputs.version }} APP_NAME=OpenBK7252 VARIANT=default OpenBK7252 > ../build.log 2>&1 || true
          
          echo "===== BUILD ERRORS (if any) ====="
          grep -i -E 'error:|Error [0-9]|undefined reference' ../build.log | head -20 || echo "No critical errors found."
          
          echo "===== OUTPUT FILES ====="
          ls -la output/${{ github.event.inputs.version }}/ 2>/dev/null || echo "Output directory not found."

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p result
          cp build.log patch.log prebuild.log result/ 2>/dev/null || true
          # Копируем только готовые прошивки
          cp obk/output/${{ github.event.inputs.version }}/OpenBK7252_UA_${{ github.event.inputs.version }}.bin result/ 2>/dev/null || true
          cp obk/output/${{ github.event.inputs.version }}/OpenBK7252_QIO_${{ github.event.inputs.version }}.bin result/ 2>/dev/null || true
          
          echo "Files in result:"
          ls -la result/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bk7252-safe-build
          path: result/
          if-no-files-found: error
