          test -s "$PATCH_FILE"
          ACTUAL_SHA="$(sha256sum "$PATCH_FILE" | awk '{print $1}')"
          EXPECTED_SHA="9c86b7748f67af3170df9d91ae0e9a979643c49fe9574104cdef7e6126289b0f"
