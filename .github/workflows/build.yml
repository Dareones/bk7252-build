name: BK7252U camera build

on:
  workflow_dispatch:
    inputs:
      target:
        default: 'bk7251'
      version:
        default: '0.3.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 patch xz-utils make git libc6-i386 lib32z1 lib32stdc++6

      - name: Clone pinned sources
        run: |
          git clone -q https://github.com/openshwprojects/OpenBK7231T_App.git obk
          cd obk && git checkout -q 168cba55
          git submodule update --init --depth 1 sdk/beken_freertos_sdk libraries/berry
          git clone -q https://github.com/pingwiner/bk7252n-camera.git ../cam

      - name: Apply camera patch
        run: |
          cd obk
          patch -p1 --forward --no-backup-if-mismatch < ../cam/openbk-port/bk7252n-camera-openbk.patch > ../patch.log 2>&1 || true
          tail -3 ../patch.log
          find . -name '*.rej' | head

      - name: Enable BKCAM only for BK7252, fix Makefile, disable SDCARD
        run: |
          cd obk
          python3 - <<'PY'
          p='src/obk_config.h'
          L=open(p).read().split('\n')
          done=[]
          for i,l in enumerate(L):
              if l.strip()=='#if PLATFORM_BK7252N':
                  if 'ENABLE_DRIVER_BKCAM' in '\n'.join(L[i:i+12]):
                      L[i]='#if PLATFORM_BK7252N || PLATFORM_BK7252'
                      done.append(i+1)
          open(p,'w').write('\n'.join(L))
          print('BKCAM guard patched at lines:', done)
          PY
          # принудительно гасим SD-карту, если где-то включена
          sed -i -E 's/^([[:space:]]*#define[[:space:]]+ENABLE_DRIVER_SDCARD[A-Z_]*[[:space:]]+)1/\10/' src/obk_config.h
          # сломанный ifeq в SDK
          sed -i 's/ifeq ($CFG_USE_CAMERA_INTF), 1)/ifeq ($(CFG_USE_CAMERA_INTF),1)/' sdk/beken_freertos_sdk/beken378/beken_src.mk
          echo "--- guards ---"; grep -n 'PLATFORM_BK7252N' src/obk_config.h
          echo "--- sdcard ---"; grep -n -i 'sdcard' src/obk_config.h || echo none
          echo "--- camera_intf make ---"; grep -n 'CFG_USE_CAMERA_INTF' sdk/beken_freertos_sdk/beken378/beken_src.mk

      - name: Diagnostics
        run: |
          mkdir -p diag
          cd obk
          { echo "=== drv_sdcard.c head ==="; head -20 src/driver/drv_sdcard.c
            echo "=== drv_sdcard_fs.c head ==="; head -20 src/driver/drv_sdcard_fs.c
            echo "=== sdcard in obk_main.mk ==="; grep -n -i 'sdcard\|sd_card' platforms/obk_main.mk || echo none
            echo "=== sd_card.h location ==="; find sdk/beken_freertos_sdk -name 'sd_card.h' || echo "NOT in SDK"
            echo "=== obk_config.h 300-400 ==="; sed -n '300,400p' src/obk_config.h
          } > ../diag/guards.txt 2>&1
          cat ../diag/guards.txt

      - name: Toolchain + Berry
        run: |
          SDK=$PWD/obk/sdk/beken_freertos_sdk
          TC=$SDK/toolchain
          mkdir -p $TC/.unpack
          tar -C $TC/.unpack --no-same-owner --no-same-permissions -xJf $TC/arm-none-eabi-gcc.tar.xz
          chmod -R u+w $TC/.unpack
          mv $TC/.unpack/arm-none-eabi $TC/arm-none-eabi
          $TC/arm-none-eabi/bin/arm-none-eabi-gcc --version | head -1
          cd obk
          mkdir -p libraries/berry/generate
          python3 ./libraries/berry/tools/coc/coc -o libraries/berry/generate \
            libraries/berry/src src/berry/modules -c include/berry_conf.h

      - name: Build
        continue-on-error: true
        run: |
          SDK=$PWD/obk/sdk/beken_freertos_sdk
          printf '#define CAM_FW_TAG "fw %s"\n' "${{ github.event.inputs.version }}" > obk/src/driver/drv_bkCam_version.h
          cd $SDK
          ARM_GCC_TOOLCHAIN="$SDK/toolchain/arm-none-eabi/bin/" \
            sh build.sh ${{ github.event.inputs.target }} ${{ github.event.inputs.version }} \
            > $GITHUB_WORKSPACE/build.log 2>&1 || true
          echo "===== ERRORS ====="
          grep -n -i 'fatal error\|error:\|Error [0-9]\|undefined reference\|not exist' $GITHUB_WORKSPACE/build.log | head -40 || true
          echo "===== last 60 ====="
          tail -60 $GITHUB_WORKSPACE/build.log
          echo "===== out ====="
          ls -la out/*.bin out/*.rbl 2>/dev/null || echo "no images"

      - name: Collect
        if: always()
        run: |
          mkdir -p result
          cp build.log patch.log result/ 2>/dev/null || true
          for f in obk/sdk/beken_freertos_sdk/out/*.bin obk/sdk/beken_freertos_sdk/out/*.rbl; do
            [ -f "$f" ] && cp "$f" result/ && echo "GOT: $f"
          done
          ls -la result/
          find result -name '*.bin' -printf '%s %p\n' 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bk7252-build
          path: |
            result/
            diag/
          if-no-files-found: warn
