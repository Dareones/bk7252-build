name: BK7252U camera build

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'SDK target'
        default: 'bk7251'
      version:
        default: '0.2.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3 patch xz-utils make git libc6-i386 lib32z1 lib32stdc++6

      - name: Clone pinned sources
        run: |
          git clone -q https://github.com/openshwprojects/OpenBK7231T_App.git obk
          cd obk && git checkout -q 168cba55
          git submodule update --init --depth 1 sdk/beken_freertos_sdk libraries/berry
          git clone -q https://github.com/pingwiner/bk7252n-camera.git ../cam

      - name: Apply camera patch
        run: |
          cd obk
          patch -p1 --forward --no-backup-if-mismatch < ../cam/openbk-port/bk7252n-camera-openbk.patch > ../patch.log 2>&1 || true
          tail -5 ../patch.log
          find . -name '*.rej' | head

      - name: Enable camera for BK7252 (U) and fix Makefile bug
        run: |
          cd obk
          # драйвер камеры был включён только для PLATFORM_BK7252N
          sed -i 's/^#if PLATFORM_BK7252N$/#if PLATFORM_BK7252N || PLATFORM_BK7252/' src/obk_config.h
          grep -n 'PLATFORM_BK7252N || PLATFORM_BK7252' src/obk_config.h || echo "WARN: guard not patched"
          # сломанный ifeq в SDK: из-за него camera_intf.c не компилировался
          sed -i 's/ifeq ($CFG_USE_CAMERA_INTF), 1)/ifeq ($(CFG_USE_CAMERA_INTF),1)/' sdk/beken_freertos_sdk/beken378/beken_src.mk
          grep -n 'CFG_USE_CAMERA_INTF' sdk/beken_freertos_sdk/beken378/beken_src.mk

      - name: Diagnostics
        run: |
          mkdir -p diag
          cd obk/sdk/beken_freertos_sdk
          echo "===== available targets =====" | tee ../../../diag/targets.txt
          ls beken378/app/config/sys_config_*.h | tee -a ../../../diag/targets.txt
          echo "===== CFG_SOC_NAME per config =====" | tee ../../../diag/soc_names.txt
          grep -H 'define CFG_SOC_NAME' beken378/app/config/sys_config_*.h | tee -a ../../../diag/soc_names.txt
          echo "===== generate_sys_config.sh =====" | tee ../../../diag/gen_cfg.txt
          cat tools/scripts/generate_sys_config.sh | tee -a ../../../diag/gen_cfg.txt
          echo "===== camera flags in candidate configs =====" | tee ../../../diag/cam_flags.txt
          grep -H -n 'CAMERA_INTF\|CFG_SOC_NAME\|SOC_BK' beken378/app/config/sys_config_bk7251.h | tee -a ../../../diag/cam_flags.txt

      - name: Toolchain + Berry
        run: |
          SDK=$PWD/obk/sdk/beken_freertos_sdk
          TC=$SDK/toolchain
          mkdir -p $TC/.unpack
          tar -C $TC/.unpack --no-same-owner --no-same-permissions -xJf $TC/arm-none-eabi-gcc.tar.xz
          chmod -R u+w $TC/.unpack
          mv $TC/.unpack/arm-none-eabi $TC/arm-none-eabi
          $TC/arm-none-eabi/bin/arm-none-eabi-gcc --version | head -1
          cd obk
          mkdir -p libraries/berry/generate
          python3 ./libraries/berry/tools/coc/coc -o libraries/berry/generate \
            libraries/berry/src src/berry/modules -c include/berry_conf.h
          ls libraries/berry/generate | head

      - name: Build
        continue-on-error: true
        run: |
          SDK=$PWD/obk/sdk/beken_freertos_sdk
          printf '#define CAM_FW_TAG "fw %s"\n' "${{ github.event.inputs.version }}" > obk/src/driver/drv_bkCam_version.h
          cd $SDK
          ARM_GCC_TOOLCHAIN="$SDK/toolchain/arm-none-eabi/bin/" \
            sh build.sh ${{ github.event.inputs.target }} ${{ github.event.inputs.version }} \
            > $GITHUB_WORKSPACE/build.log 2>&1 || true
          echo "===== last 80 lines ====="
          tail -80 $GITHUB_WORKSPACE/build.log
          echo "===== errors ====="
          grep -n -i 'error\|not exist\|No rule\|undefined reference' $GITHUB_WORKSPACE/build.log | head -40 || true
          echo "===== out ====="
          ls -la out/ 2>/dev/null || echo "no out dir"

      - name: Collect
        if: always()
        run: |
          mkdir -p result
          cp build.log result/ 2>/dev/null || true
          cp patch.log result/ 2>/dev/null || true
          for f in obk/sdk/beken_freertos_sdk/out/*.bin obk/sdk/beken_freertos_sdk/out/*.rbl; do
            [ -f "$f" ] && cp "$f" result/ && echo "GOT: $f"
          done
          ls -la result/
          echo "===== SIZES ====="
          find result -name '*.bin' -printf '%s %p\n' 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bk7252-build
          path: |
            result/
            diag/
          if-no-files-found: warn
